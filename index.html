<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainglass — I build for humans</title>
    <meta
      name="description"
      content="A studio that builds thoughtful software for humans. Move your cursor to wipe away the rain."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <main
      id="hero"
      class="relative h-screen w-full overflow-hidden select-none"
    >
      <!-- Layer 0: sharp background image -->
      <div id="bg-sharp" class="absolute inset-0 z-0 bg-cover bg-center"></div>

      <!-- cool-blue depth tint over the sharp layer -->
      <div
        class="pointer-events-none absolute inset-0 z-[1] bg-gradient-to-b from-sky-950/40 via-blue-950/30 to-slate-950/60"
      ></div>

      <!-- Layer 1: frosted overlay, clipped by the mask canvas -->
      <div id="frost-layer" class="absolute inset-0 z-10">
        <div id="bg-frost" class="absolute inset-0 bg-cover bg-center"></div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-sky-200/20 via-blue-300/15 to-slate-200/10"
        ></div>
        <canvas id="rain" class="absolute inset-0 h-full w-full"></canvas>
      </div>

      <!-- hidden canvas that drives the mask alpha -->
      <canvas id="mask" class="hidden"></canvas>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
