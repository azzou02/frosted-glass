<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainglass — I build for humans</title>
    <meta
      name="description"
      content="A studio that builds thoughtful software for humans. Move your cursor to wipe away the rain."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <main
      id="hero"
      class="relative h-screen w-full overflow-hidden select-none"
    >
      <!-- Layer 0: sharp background image -->
      <div id="bg-sharp" class="absolute inset-0 z-0 bg-cover bg-center"></div>

      <!-- cool-blue depth tint over the sharp layer -->
      <div
        class="pointer-events-none absolute inset-0 z-[1] bg-gradient-to-b from-sky-950/40 via-blue-950/30 to-slate-950/60"
      ></div>

      <!-- Layer 1: frosted overlay, clipped by the mask canvas -->
      <div id="frost-layer" class="absolute inset-0 z-10">
        <div id="bg-frost" class="absolute inset-0 bg-cover bg-center"></div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-sky-200/20 via-blue-300/15 to-slate-200/10"
        ></div>
        <canvas id="rain" class="absolute inset-0 h-full w-full"></canvas>
      </div>

      <!-- hidden canvas that drives the mask alpha -->
      <canvas id="mask" class="hidden"></canvas>

      <!-- Layer 2: hero content, always sharp -->
      <div
        class="pointer-events-none relative z-20 flex h-full flex-col items-center justify-center px-6 text-center"
      >
        <p
          class="mb-5 text-xs font-medium uppercase tracking-[0.4em] text-sky-200/80"
        >
          Rainglass Studio
        </p>
        <h1
          class="max-w-4xl text-5xl font-semibold leading-[1.05] tracking-tight text-white drop-shadow-[0_2px_30px_rgba(2,6,23,0.6)] sm:text-6xl md:text-7xl"
        >
          I build for
          <span
            class="bg-gradient-to-r from-sky-200 via-cyan-100 to-blue-200 bg-clip-text text-transparent"
            >humans</span
          >.
        </h1>
        <p
          class="mt-6 max-w-xl text-base text-slate-200/90 sm:text-lg"
        >
          Software with warmth and craft. Move your cursor across the glass to
          clear the rain and see what&rsquo;s underneath.
        </p>
        <div class="pointer-events-auto mt-10 flex flex-wrap items-center justify-center gap-4">
          <a
            href="#"
            class="rounded-full bg-sky-400/90 px-7 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-sky-500/20 transition hover:bg-sky-300 hover:shadow-sky-400/40"
            >Start a project</a
          >
          <a
            href="#"
            class="rounded-full border border-white/25 bg-white/5 px-7 py-3 text-sm font-semibold text-white backdrop-blur-sm transition hover:bg-white/10"
            >See our work</a
          >
        </div>
        <p class="mt-14 text-xs text-slate-300/60">
          <span class="inline-block animate-pulse">↕</span> move your mouse over
          the glass
        </p>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
